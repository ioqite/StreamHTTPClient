name=StreamHTTPClient
version=1.0.3
author=Ioqit (https://github.com/ioqite)
maintainer=Ioqit (https://github.com/ioqite)
sentence=A streaming HTTP/HTTPS client for Arduino with sync/async support, bidirectional streaming, SSE, chunked transfer, gzip decompression, keep-alive, redirects and BasicAuth.
paragraph=API-compatible with Arduino HTTPClient. Built on WiFiClient / WiFiClientSecure. Supports FreeRTOS-based async requests with cooperative polling, Server-Sent Events (SSE), chunked uploads/downloads, Content-Length and Chunked response parsing, automatic redirect following, HTTP Basic Authentication, custom headers and gzip/deflate decompression (powered by miniz).
